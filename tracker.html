<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tracker.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Theme Management -->
    <script src="theme.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <a href="index.html" class="logo">
                <i data-lucide="zap"></i>
                Habit<span>Flow</span>
            </a>
            <div style="display: flex; align-items: center; gap: 24px;">
                <span id="current-date" style="font-weight: 600; color: var(--text-muted); font-size: 0.875rem;"></span>
                <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle Theme">
                    <!-- Icons injected by theme.js -->
                </button>
                <a href="index.html" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.8125rem;">Exit App</a>
            </div>
        </div>
    </nav>

    <main class="dashboard container">
        <header style="margin-bottom: 50px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 id="greeting" style="font-size: 2.5rem; margin-bottom: 8px; font-weight: 700;">Good morning!</h1>
                    <p style="color: var(--text-muted); font-size: 1.1rem;">Keep the streak alive 🔥</p>
                </div>
                <button id="add-habit-btn" class="btn btn-primary">
                    <i data-lucide="plus"></i> New Habit
                </button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Left Column: Habits List -->
            <div class="habits-section">
                <div class="card">
                    <div class="card-header">
                        <h2 style="font-size: 1.25rem;">Daily Rituals</h2>
                        <span id="habit-count" style="font-size: 0.875rem; color: var(--text-muted);">0 habits</span>
                    </div>
                    
                    <div id="habits-list">
                        <!-- Habits will be injected here -->
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" style="text-align: center; padding: 60px 0; display: none;">
                        <div style="width: 80px; height: 80px; background: rgba(129, 140, 248, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: var(--text-muted);">
                            <i data-lucide="sparkles" style="width: 40px; height: 40px;"></i>
                        </div>
                        <h3 style="margin-bottom: 8px;">No habits yet</h3>
                        <p style="color: var(--text-muted);">Small steps lead to big changes. Start yours now.</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Stats -->
            <div class="stats-section">
                <!-- Daily Progress Ring -->
                <div class="card" style="text-align: center;">
                    <h3 style="margin-bottom: 24px; font-size: 1.1rem;">Today's Completion</h3>
                    <div class="progress-container">
                        <svg class="progress-ring" width="200" height="200">
                            <circle class="progress-ring-bg" stroke="var(--border)" stroke-width="12" fill="transparent" r="85" cx="100" cy="100" opacity="0.3" />
                            <circle id="progress-circle" class="progress-ring-circle" stroke="var(--primary)" stroke-width="12" stroke-dasharray="534.07" stroke-dashoffset="534.07" stroke-linecap="round" fill="transparent" r="85" cx="100" cy="100" />
                        </svg>
                        <div class="progress-text">
                            <span id="progress-percent">0%</span>
                        </div>
                    </div>
                    <p id="progress-summary" style="font-size: 0.9rem; color: var(--text-muted);">0 of 0 habits completed</p>
                </div>

                <!-- Weekly Summary -->
                <div class="card">
                    <h3 style="margin-bottom: 24px; font-size: 1.1rem;">Consistency Trend</h3>
                    <div class="weekly-chart" id="weekly-chart">
                        <!-- Chart bars will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Adding Habit -->
    <div id="add-habit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 450px; margin: 20px; border-color: rgba(129, 140, 248, 0.3);">
            <div class="card-header">
                <h2>New Ritual</h2>
                <button id="close-modal" style="background: none; color: var(--text-muted);"><i data-lucide="x"></i></button>
            </div>
            <form id="habit-form">
                <div class="form-group">
                    <label for="habit-name">Ritual Name</label>
                    <input type="text" id="habit-name" class="form-input" placeholder="e.g. Deep Meditation" required autofocus>
                </div>
                <div class="form-group">
                    <label for="habit-category">Focus Area</label>
                    <select id="habit-category" class="form-input">
                        <option value="Physical Health">Physical Health</option>
                        <option value="Mental Growth">Mental Growth</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Creativity">Creativity</option>
                        <option value="Relationships">Relationships</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px;">Initialize Habit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
