<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | HabitFlow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <i data-lucide="zap"></i> HabitFlow
            </a>
            <div class="nav-links" style="display: flex; align-items: center; gap: 1rem;">
                <div class="theme-toggle-container">
                    <span class="theme-label" aria-live="polite">Light</span>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <svg class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.803 5.197a.75.75 0 00-1.06-1.06l-1.591 1.591a.75.75 0 101.06 1.061l1.591-1.591zM6.788 18.273a.75.75 0 10-1.06-1.06l-1.591 1.591a.75.75 0 101.06 1.061l1.591-1.591zM2.25 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3a.75.75 0 01-.75-.75zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM5.197 5.197a.75.75 0 000 1.06l1.591 1.591a.75.75 0 101.06-1.06l-1.591-1.591a.75.75 0 00-1.06 0zM18.273 18.273a.75.75 0 000-1.06l-1.591-1.591a.75.75 0 10-1.06 1.061l1.591 1.591a.75.75 0 001.06 0zM12 18.75a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V19.5a.75.75 0 01.75-.75z"/></svg>
                        <svg class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>
                    </button>
                </div>
                <button class="btn btn-primary" id="addHabitBtn">
                    <i data-lucide="plus"></i> Add Habit
                </button>
            </div>
        </div>
    </nav>

    <main class="container section-padding">
        <div class="app-header">
            <h1 id="greeting">Good morning!</h1>
            <p style="color: var(--text-muted);">Keep the streak alive 🔥</p>
        </div>

        <div class="app-grid">
            <!-- Habit List -->
            <div id="habitList">
                <!-- Habits will be injected here -->
            </div>

            <!-- Sidebar -->
            <aside>
                <div class="sidebar-card">
                    <h3 style="margin-bottom: 1.5rem; text-align: center;">Daily Progress</h3>
                    <div class="progress-circle">
                        <svg width="150" height="150">
                            <circle class="bg" cx="75" cy="75" r="70"></circle>
                            <circle class="bar" id="progressCircle" cx="75" cy="75" r="70"></circle>
                        </svg>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;" id="progressSubtext">
                        0 of 0 habits completed
                    </p>
                </div>

                <div class="sidebar-card">
                    <h3 style="margin-bottom: 1rem;">Weekly Overview</h3>
                    <div class="chart-container" id="weeklyChart">
                        <!-- Chart bars will be injected here -->
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 style="margin-bottom: 1.5rem;">Add New Habit</h2>
            <form id="habitForm">
                <div class="form-group">
                    <label for="habitName">Habit Name</label>
                    <input type="text" id="habitName" placeholder="e.g. Drink Water" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="closeModal" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Habit</button>
                </div>
            </form>
        </div>
    </div>



    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
